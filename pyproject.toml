[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigvcf"
version = "0.1.0"
description = "Mutation-count matrix extraction (SBS96) directly from VCFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pysam",
]

[project.scripts]
sigvcf = "sigvcf.cli:main"

[tool.setuptools]
packages = ["sigvcf"]
